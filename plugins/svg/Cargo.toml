[package]
name = "svg-guest"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The building editor supplies its versioned interface; no host source path is needed.
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde_json = "1.0"
# Parse intrinsic SVG dimensions in the isolated guest; native rasterization belongs to the host.
usvg = { version = "=0.45.1", default-features = false }
