# Recognition and highlighting are independent providers; the host has no fixed language table.
file_icons = "icons.json"

[plugin]
id = "rust"
name = "Rust"
version = "0.3.0"
host_version = ">=0.1.0"

[[language_definitions]]
id = "rust"
name = "Rust"
extensions = ["rs"]

[[highlighters]]
id = "syntax"
language = "rust"
grammar_name = "rust"
grammar = "grammar/rust.wasm"
highlights = "queries/highlights.scm"
# Keep the ABI exported by the bundled upstream grammar.
tree_sitter_abi = 15
# Runnable targets this plugin can offer. The host reads the declaration and applies it; it holds no
# Rust-specific knowledge of what a target is.
[[run_targets]]
id = "rust-binary"
file = "run-targets/rust.json"
