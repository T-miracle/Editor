# Recognition and highlighting are independent providers; the host has no fixed language table.
file_icons = "icons.json"

[plugin]
id = "rust"
name = "Rust"
version = "0.2.1"
host_version = ">=0.1.0"

[[language_definitions]]
id = "rust"
name = "Rust"
extensions = ["rs"]

[[highlighters]]
id = "syntax"
language = "rust"
grammar_name = "rust"
grammar = "grammar/rust.wasm"
highlights = "queries/highlights.scm"
# Keep the ABI exported by the bundled upstream grammar.
tree_sitter_abi = 15
