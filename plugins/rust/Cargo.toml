[package]
name = "rust-language-guest"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The editor's public --plugin-cargo command supplies this exact distributed SDK.
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde_json = "1.0"
serde = {version="1.0",features=["derive"]}

[workspace]
