# Independent builds use the SDK supplied by the host --plugin-cargo entry point.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde_json = "1.0"
