[package]
name = "platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dirs.workspace = true
editor-core = { path = "../editor-core" }
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# Reuse GPUI's locked Windows bindings for cancellable, STA-owned common dialogs.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

