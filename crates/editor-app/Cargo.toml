[package]
name = "editor-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# Use the already-locked date library to render receipt dates in the user's system timezone.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
editor-core = { path = "../editor-core" }
dirs.workspace = true
gpui-kit.workspace = true
gpui-base = "0.7.0"
glob = "0.3"
lsp-types = "0.97.0"
platform-windows = { path = "../platform-windows" }
plugin-schema = { path = "../plugin-schema" }
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
rust-i18n.workspace = true
serde.workspace = true
serde_json = "1.0"
semver = "1"
# Enable Tree-sitter's Wasmtime-backed runtime for plugin-provided grammars.
tree-sitter = { version = "0.26.13", features = ["wasm"] }
# Only enables Wasmtime's compiled-module cache for that runtime; the engine, cache and grammar
# types stay the ones `tree-sitter` re-exports. Plugin injection layers create a fresh WASM store
# per parse, and without the cache every one of them recompiled the grammar module on the editing
# path (measured ~90 ms per keystroke in release, ~1.3 s in debug).
wasmtime = { version = "36.0.16", default-features = false, features = ["cache"] }
tracing = "0.1"
url = "2.5"
plugin-runtime = { path = "../plugin-runtime" }
futures = "0.3"
sha2 = "0.10"
# Full-color plugin vectors are rasterized on the existing background worker.
resvg = "=0.45.1"
svgtypes = "=0.15.3"
# Explicitly retain the documented bitmap formats; native images are decoded under host quotas.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile.workspace = true
# Discover nested plugin manifests without traversing ignored build output.
ignore.workspace = true
notify.workspace = true
# Validate provider name patterns and preserve native grapheme deletion in linked ranges.
regex = "1"
unicode-segmentation = "1"

[build-dependencies]
# Reuse the locked Windows resource compiler for the product icon and file metadata.
embed-resource = "=3.0.11"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# Reidentified hybrid fixtures retain their declarative resources through a parsed TOML manifest.
toml.workspace = true
# Build independent declarative package fixtures through the public ZIP inspection boundary.
zip = { version = "4", default-features = false, features = ["deflate"] }
