[package]
name = "plugin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# Native tool discovery and bounded workspace discovery reuse existing dependency families.
dirs.workspace = true
glob = "0.3"
ignore.workspace = true
globset = "0.4"
# Parse preview-mode SVG artwork without resource resolution or permissive XML string matching.
roxmltree = "0.21.1"
plugin-protocol = { path = "../plugin-protocol" }
plugin-schema = { path = "../plugin-schema" }
serde.workspace = true
serde_json.workspace = true
wasmtime = { version = "36.0.16", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = "36.0.16"
portable-pty = "0.9"
semver = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile.workspace = true
