<script>

/* Every mutation below is limited to these mock objects. Applying never reaches the native host. */
function syncUrl(){const url=new URL(location.href);url.searchParams.set('variant',state.variant);url.searchParams.set('theme',state.theme);if(state.panel)url.searchParams.set('panel',state.panel);else url.searchParams.delete('panel');history.replaceState({},'',url);}
function note(message){state.toast=message;render();setTimeout(()=>{state.toast='';render();},2600);}
function changeVariant(offset){const keys=Object.keys(variants);state.variant=keys[(keys.indexOf(state.variant)+offset+keys.length)%keys.length];state.panel='';syncUrl();render();}
const actionButton=(name,label,action,disabled=false)=>`<button class="icon-btn" aria-label="${label}" title="${label}" data-action="${action}" ${disabled?'disabled':''}>${icon(name)}</button>`;
/* Types are a demonstration of generic manual targets plus discovery from an installed provider. */
function sidebar(){let groups='';for(const group of ['Rust / Cargo','程序','Shell 脚本']){const matches=configs.filter(config=>config.group===group);groups+=`<div class="tree-group">${icon('chevron')}${esc(group)}<span class="count">${matches.length}</span></div>`;groups+=matches.map(config=>`<div class="tree-row ${state.config===config.id?'active':''}" role="button" tabindex="0" data-config="${config.id}">${icon(group==='Rust / Cargo'?'code':group==='程序'?'terminal':'file','config-icon')}<span class="truncate">${esc(config.name)}</span>${icon(config.shared?'file':'home','scope')}</div>`).join('');}
return `<aside class="sidebar"><div class="side-toolbar flex">${actionButton('plus','添加配置','add-config')}${actionButton('minus','删除配置','remove-config')}${actionButton('copy','复制配置','copy-config')}<span class="rule"></span>${actionButton('refresh','重新发现目标','discover')}<span class="counter">${configs.length} 个配置</span></div><div class="search"><input id="config-search" placeholder="搜索配置…" aria-label="搜索配置"></div><div class="config-tree">${groups}</div><div class="side-bottom"><button data-action="discover">${icon('search')}发现项目目标</button><div class="side-legend"><span>${icon('file')} 项目共享</span><span>${icon('home')} 仅本机</span></div></div>${state.panel==='add'?addMenu():''}</aside>`;}
function addMenu(){return `<div class="add-menu" role="menu"><div class="menu-caption">添加配置</div><button class="menu-item" data-action="new-program">${icon('terminal')}<div>程序<div class="sub">直接运行可执行程序</div></div></button><button class="menu-item" data-action="new-script">${icon('file')}<div>Shell 脚本<div class="sub">指定解释器与脚本内容</div></div></button><div class="menu-divider"></div><div class="menu-caption">来自已安装插件的目标</div><button class="menu-item" data-action="new-provided">${icon('code')}<div>Rust / Cargo<div class="sub">发现目标后创建配置</div></div>${icon('right')}</button><div class="menu-caption">可用类型随已启用插件变化</div></div>`;}
function nameHeader(){const config=current();return `<div class="name-row flex"><label class="name-label tiny" for="config-name">名称</label><input class="grow" id="config-name" data-field="name" value="${esc(config.name)}"><label class="share-checkbox"><input type="checkbox" data-field="shared" ${config.shared?'checked':''}>存为项目配置</label></div><div class="source-line">${icon(config.target?'code':config.interpreter?'file':'terminal')}<span>${config.target?'来自 Rust 插件 · crates/editor-app/Cargo.toml':config.interpreter?'手动配置 · Shell 脚本':'手动配置 · 程序'}</span><span>·</span><span>本机工作区</span></div>`;}
function targetFields(){const config=current();let target;if(config.target)target=`<div class="field-composite"><select aria-label="目标"><option>${esc(config.target)}</option><option>editor-app · Release</option></select><button class="link" data-action="discover">重新发现</button></div>`;else if(config.interpreter)target=`<div class="field-composite"><input data-field="interpreter" value="${esc(config.interpreter)}">${actionButton('folder','选择解释器','browse')}</div>`;else target=`<div class="field-composite"><input data-field="program" value="${esc(config.program||'')}" placeholder="选择可执行程序">${actionButton('folder','选择程序','browse')}</div>`;
return `<div class="field-grid"><label>${config.target?'运行目标':config.interpreter?'解释器':'程序'}</label>${target}<label>工作目录</label><div class="field-composite"><input class="mono" data-field="directory" value="${esc(config.directory)}">${actionButton('folder','选择工作目录','browse')}</div><label>${config.interpreter?'解释器参数':'程序参数'}</label><div class="arg-field"><input placeholder="无参数" readonly value="${esc(config.args.join('  '))}"><button data-action="args">逐项编辑 ${icon('dots')}</button></div>${config.interpreter?`<label>脚本内容</label><textarea data-field="script" class="mono">${esc(config.script||'')}</textarea>`:''}</div>`;}
function stepSection(list){const config=current(),steps=config[list],isBuild=list==='build';const selected=state.list===list?activeStep():null;const tools=`<div class="tools">${actionButton('plus','添加步骤','add-step:'+list)}${actionButton('edit','编辑步骤','edit-step:'+list,!selected||selected.locked)}${actionButton('trash','移除步骤','remove-step:'+list,!selected||selected.locked)}<span class="rule"></span>${actionButton('up','上移','up-step:'+list,!selected||selected.locked||state.step<1)}${actionButton('down','下移','down-step:'+list,!selected||selected.locked||state.step>=steps.length-1)}</div>`;
const rows=steps.map((step,index)=>`<div class="step-row ${state.list===list&&state.step===index?'selected':''}" role="button" tabindex="0" data-step="${list}:${index}"><span class="step-number">${index+1}</span><span class="step-name">${icon(step.locked?'build':step.kind==='构建引用'?'link':step.kind==='Shell 脚本'?'file':'terminal')}<span class="truncate">${esc(step.name)}</span>${step.locked?icon('lock','locked'):''}</span><span class="step-kind">${esc(step.kind)}</span><span class="step-summary truncate ${step.program?'mono':''}">${esc(step.summary)}</span></div>`).join('');
return `<section><div class="section-title"><h3>${isBuild?'构建动作':'运行前步骤'}</h3><span class="section-note">${isBuild?'单独构建执行此列表':'仅在运行 / 调试前执行'}</span>${tools}</div><div class="steps-table"><div class="table-header"><span>#</span><span>名称</span><span>类型</span><span>目标 / 参数</span></div>${rows||'<div class="muted tiny" style="padding:15px">暂无步骤；点击 + 添加。</div>'}</div><p class="table-hint">${icon('info')}<span>${isBuild?'插件准备动作保留来源；成功后取得本次构建产物。':'先完成构建，再依次执行这里的步骤；失败后不启动程序。'}</span></p></section>`;}
function environmentSummary(){return `<div class="environment-row"><div class="summary-field"><span>环境变量</span><button data-action="environment">2 项 · 仅本机 ${icon('dots')}</button></div><div class="summary-field"><span>运行提供者</span><button data-action="provider">跟随默认 · 终端 ${icon('chevron')}</button></div></div><button class="advanced" data-action="advanced">${icon(state.advanced?'up':'chevron')}调试与本机工具路径</button>${state.advanced?`<div class="advanced-details field-grid"><label>调试提供者</label><div class="muted tiny">跟随当前工作区选择 · Rust Debugger</div><label>本机工具路径</label><input placeholder="使用已安装工具与 PATH；可添加本机覆盖"></div>`:''}`;}
function VariantA(){return `<main class="editor"><div class="form-scroll">${nameHeader()}<div class="section-title"><h3>目标与参数</h3></div>${targetFields()}${stepSection('build')}${stepSection('prelaunch')}${environmentSummary()}</div></main>`;}
function sequenceRail(){return `<aside class="sequence-rail"><h4>运行 / 调试的执行顺序</h4><div class="rail-node selected"><span class="order">1</span>构建动作</div><div class="rail-connector"></div><div class="rail-node"><span class="order">2</span>运行前步骤</div><div class="rail-connector"></div><div class="rail-node"><span class="order">3</span>启动目标</div><div class="hint">点击顶栏构建图标时，<br>仅执行第 1 阶段。<br><br>失败或取消会阻止<br>后续步骤与程序启动。</div></aside>`;}
function VariantB(){let page;if(state.tab==='build')page=`<h2>构建与准备</h2><p class="muted">分别维护构建动作和运行前步骤，顺序清晰可见。</p><div class="b-build-grid"><div>${stepSection('build')}${stepSection('prelaunch')}</div>${sequenceRail()}</div>`;else if(state.tab==='run')page=`<h2>运行目标</h2><p class="muted">配置程序、字面参数与工作目录。</p>${targetFields()}`;else if(state.tab==='environment')page=`<h2>本机环境</h2><p class="muted">个人环境和工具路径留在本机。</p>${environmentSummary()}`;else page=`<h2>调试设置</h2><p class="muted">保存启动设置；运行中的调用栈、变量和控制在调试面板查看。</p><div class="field-grid"><label>调试提供者</label><input readonly value="跟随工作区选择 · Rust Debugger"><label>断点</label><button data-action="breakpoints">编辑此配置的断点 ${icon('dots')}</button></div>`;
return `<main class="editor"><div class="b-header">${nameHeader()}</div><nav class="b-tabs">${[['run','运行'],['build','构建'],['debug','调试'],['environment','环境']].map(([key,label])=>`<button class="${state.tab===key?'active':''}" data-tab="${key}">${label}</button>`).join('')}</nav><div class="b-page">${page}</div></main>`;}
/* A step has no separate working-directory field: actions inherit the current configuration,
   while a build reference uses the referenced configuration's own build context. */
function stepFields(step=activeStep()){
 const item=step&&!step.locked?step:formatStep;
 const isReference=state.stepType==='构建引用',isScript=state.stepType==='Shell 脚本';
 return `<div class="field-grid"><label>步骤名称</label><input id="step-name" value="${esc(item.name)}"><label>${isReference?'引用配置':isScript?'解释器':'程序'}</label>${isReference?'<select id="step-reference"><option>资源生成</option><option>Editor · Release</option></select>':`<div class="field-composite"><input id="step-program" class="mono" value="${esc(isScript?item.interpreter||'powershell.exe':item.program||'cargo')}">${actionButton('folder','选择程序或解释器','browse')}</div>`}${isReference?'<label>执行内容</label><input value="所选配置的构建动作" readonly>':`<label>参数</label><textarea id="step-args" class="mono" aria-label="参数，每行一个">${esc((item.args||['fmt','--check']).join('\n'))}</textarea>`}${isScript?`<label>脚本</label><textarea id="step-script" class="mono">${esc(item.script||'Write-Output "Prepare"')}</textarea>`:''}<label>工作目录</label><span class="inherit-note">${isReference?'使用被引用配置的工作目录':'继承当前配置 · '+esc(current().directory)}</span></div>`;
}
function typeTabs(){return `<div class="type-tabs">${['程序','Shell 脚本','构建引用'].map(type=>`<button class="${state.stepType===type?'active':''}" data-step-type="${type}">${type}</button>`).join('')}</div>`;}
/* Sequence layouts expose the same actions as the table; plugin-owned preparation stays locked. */
function sequenceTools(list){const steps=current()[list],selected=state.list===list?activeStep():null;return `<div class="tools">${actionButton('plus','添加步骤','add-step:'+list)}${actionButton('edit','编辑步骤','edit-step:'+list,!selected||selected.locked)}${actionButton('trash','移除步骤','remove-step:'+list,!selected||selected.locked)}${actionButton('up','上移','up-step:'+list,!selected||selected.locked||state.step<1)}${actionButton('down','下移','down-step:'+list,!selected||selected.locked||state.step>=steps.length-1)}</div>`;}
function VariantC(){const config=current();const nodes=list=>config[list].map((step,index)=>`<div class="pipeline-node ${state.list===list&&state.step===index?'active':''}" data-step="${list}:${index}" tabindex="0"><span class="order">${String(index+1).padStart(2,'0')}</span>${icon(step.locked?'build':step.kind==='构建引用'?'link':'terminal')}<div class="grow"><div>${esc(step.name)}</div><div class="detail truncate">${esc(step.summary)}</div></div>${step.locked?icon('lock'):`<span class="badge">${esc(step.kind)}</span>`}</div><div class="pipeline-link"></div>`).join('');
return `<main class="editor"><div class="c-header">${nameHeader()}</div><div class="c-workspace"><section class="pipeline"><h3>启动顺序</h3><div class="muted tiny">当前配置 · 构建 → 准备 → 目标</div><div class="section-title"><h3>构建动作</h3>${sequenceTools('build')}</div>${nodes('build')}<div class="section-title"><h3>运行前步骤</h3>${sequenceTools('prelaunch')}</div>${nodes('prelaunch')}<div class="section-title"><h3>最终目标</h3></div><div class="pipeline-node final">${icon('play')}<div><div>${esc(config.target||config.program||config.interpreter)}</div><div class="detail">仅在所有步骤成功后启动</div></div></div><p class="hint">单独构建只执行构建动作。<br>选中步骤查看属性，图标用于编辑与调整顺序。</p></section><aside class="action-inspector"><div class="section-title"><h3>${esc(activeStep()?.name||'步骤设置')}</h3><span class="badge">步骤编辑</span></div>${activeStep()?.locked?'<div class="muted tiny">该动作由插件提供，构建产物由本次准备结果确定。</div>':`${typeTabs()}${stepFields()}<div class="inspector-note">每行一个字面参数，包含空格仍作为一项传递。<br>构建引用读取被引用配置的当前构建动作。</div>`}</aside></div></main>`;}
/* These checks demonstrate inline feedback only; native validation remains the source of truth. */
function draftProblem(){const config=current();if(!config.name.trim())return '请填写配置名称';if(!config.target&&!(config.interpreter||config.program||'').trim())return config.group==='Shell 脚本'?'请选择解释器':'请选择可执行程序';if(config.interpreter&&!config.script.trim())return '请填写脚本内容';return '';}
function footer(){const config=current(),problem=draftProblem();return `<footer class="modal-footer"><div class="status-row ${problem?'invalid':''}">${icon(problem?'info':'check')}<span>${problem||'目标有效'}</span>${problem?'':`<span>·</span><span>${config.target?'支持运行与调试':'配置完整'}</span>`}<span class="dirty">${state.dirty?'有未应用的修改':'已保存 · 演示状态'}</span></div><div class="save-row"><div class="privacy">${icon('lock')}环境变量、工具路径与提供者选择仅保存在本机</div><span class="footer-scope">${config.shared?'项目共享':'仅本机'}</span><button data-action="cancel">取消</button><button data-action="apply" ${state.dirty&&!problem?'':'disabled'}>应用</button><button class="primary" data-action="save" ${problem?'disabled':''}>保存并关闭</button></div></footer>`;}
function stepDialog(){return `<div class="step-overlay"><section class="step-dialog" role="dialog" aria-label="编辑步骤"><header>编辑${state.list==='build'?'构建动作':'运行前步骤'}${actionButton('close','关闭步骤编辑','close-panel')}</header><div class="step-content"><div class="muted">将程序、脚本和构建引用作为明确的步骤编辑。</div>${typeTabs()}${stepFields()}<p class="note">每行一个参数；空格与标点保留原样。<br>保存步骤只更新配置草稿，应用配置后才持久化。</p></div><footer><span class="muted">不会执行此步骤</span><button data-action="close-panel">取消</button><button class="primary" data-action="save-step">保存步骤</button></footer></section></div>`;}
function environmentDialog(){return `<div class="step-overlay"><section class="step-dialog environment-dialog" role="dialog" aria-label="本机环境变量"><header>本机环境变量${actionButton('close','关闭环境变量','close-panel')}</header><div class="step-content"><div class="muted">项目共享配置不包含这里的名称与值。</div><div class="field-grid"><label>变量名</label><label>值</label><input value="RUST_BACKTRACE"><input value="1"><input value="RUST_LOG"><input value="info"></div></div><footer><span class="muted">仅此配置 · 仅本机</span><button data-action="close-panel">取消</button><button class="primary" data-action="save-environment">保存到草稿</button></footer></section></div>`;}
function desktop(){return `<div class="desktop"><div class="desktop-top flex"><span class="app-mark">E</span><strong class="tiny">Me Editor</strong><div class="runtime flex"><span>Editor · Debug ${icon('chevron')}</span>${icon('build')}${icon('play','good')}${icon('bug')}${icon('stop')}<span class="rule"></span>${icon('settings')}<span>—</span><span>□</span><span>×</span></div></div><div class="desktop-body"><div class="explorer"><div>资源管理器</div><p>⌄ Editor-run-debug-build</p><p>　› .github</p><p>　⌄ crates</p><p>　　› editor-app</p><p>　　› editor-core</p><p>　› docs</p><p>　› plugins</p><p>　› scripts</p><p>　Cargo.toml</p></div><div class="code-area"><div class="muted tiny">main.rs　　Cargo.toml</div><pre>// Me Editor native application

        initialize_workspace(cx);

}</pre></div></div><div class="desktop-status"><span>Editor-run-debug-build　 /　crates/editor-app/src/main.rs</span><span>Rust　 UTF-8　 Ln 8, Col 1</span></div></div>`;}
/* Only browser-local view state and sample drafts are updated; no host connector is referenced. */
function render(){document.body.className=`${state.theme==='light'?'light':''} ${params.has('capture')?'capturing':''}`;document.querySelector('#root').innerHTML=`${desktop()}<div class="design-caption"><strong>${state.variant} / ${variants[state.variant]}</strong><span>ME EDITOR　 /　B2 设计原型　 /　演示数据</span></div><div class="stage"><section class="modal variant-${state.variant}" aria-label="构建与运行配置"><header class="modal-head">${icon('build')}构建与运行配置${actionButton('close','关闭配置','cancel')}</header><div class="body">${sidebar()}${state.variant==='A'?VariantA():state.variant==='B'?VariantB():VariantC()}</div>${footer()}${state.panel==='step'?stepDialog():state.panel==='environment'?environmentDialog():''}${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}</section></div><nav class="switcher" aria-label="设计方案切换"><button data-action="previous" aria-label="上一个方案">${icon('left')}</button><span class="variant-label">${state.variant} · ${variants[state.variant]}</span><button data-action="next" aria-label="下一个方案">${icon('right')}</button><span class="divider"></span><button data-action="theme">${state.theme==='dark'?'浅色':'深色'}主题</button></nav><div class="demo-note">设计原型 · 所有修改仅在内存中 · 不保存文件，不执行命令</div>`;wire();}
function wire(){document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>dispatch(button.dataset.action)));document.querySelectorAll('[data-config]').forEach(row=>row.addEventListener('click',()=>{state.config=row.dataset.config;state.panel='';state.list='build';state.step=current().build.length>1?1:0;state.dirty=false;render();}));document.querySelectorAll('[data-step]').forEach(row=>{row.addEventListener('click',()=>{const [list,index]=row.dataset.step.split(':');state.list=list;state.step=Number(index);state.stepType=activeStep()?.kind==='构建引用'?'构建引用':'程序';render();});row.addEventListener('dblclick',()=>{if(!activeStep()?.locked){state.panel='step';syncUrl();render();}});});document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{state.tab=button.dataset.tab;render();}));document.querySelectorAll('[data-step-type]').forEach(button=>button.addEventListener('click',()=>{state.stepType=button.dataset.stepType;render();}));document.querySelectorAll('[data-field]').forEach(input=>input.addEventListener('change',()=>{current()[input.dataset.field]=input.type==='checkbox'?input.checked:input.value;state.dirty=true;render();}));document.querySelector('#config-search')?.addEventListener('input',event=>{document.querySelectorAll('.tree-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(event.target.value.toLowerCase()));});}
/* The structured editor illustrates RunStep/StepTarget; identities stay references, never copies. */
function dispatch(action){const [name,list]=action.split(':');if(name==='previous')return changeVariant(-1);if(name==='next')return changeVariant(1);if(name==='theme'){state.theme=state.theme==='dark'?'light':'dark';syncUrl();return render();}if(name==='add-config'){state.panel=state.panel==='add'?'':'add';syncUrl();return render();}if(name==='close-panel'){state.panel='';syncUrl();return render();}if(name==='advanced'){state.advanced=!state.advanced;return render();}if(name==='environment'){state.panel='environment';syncUrl();return render();}if(name==='apply'||name==='save'){state.dirty=false;return note('设计演示：配置已应用到内存，未写入文件。');}if(name==='cancel'){state.panel='';state.dirty=false;syncUrl();return note('设计演示：取消修改，保留原型供查看。');}if(name==='save-environment'){state.panel='';state.dirty=true;syncUrl();return render();}if(name==='save-step'){const step=activeStep();if(step&&!step.locked){step.name=document.querySelector('#step-name').value;step.kind=state.stepType;if(state.stepType==='程序'){step.program=document.querySelector('#step-program').value;step.args=document.querySelector('#step-args').value.split('\n');step.summary=[step.program,...step.args].join(' ');}else if(state.stepType==='构建引用')step.summary='资源生成 · 构建动作';else step.summary='PowerShell · 显式脚本';}state.dirty=true;state.panel='';syncUrl();return render();}if(name==='edit-step'){if(state.list!==list||!activeStep()||activeStep().locked)return;state.panel='step';syncUrl();return render();}if(name==='add-step'){state.list=list;current()[list].push({...formatStep,name:'新步骤',args:[...formatStep.args]});state.step=current()[list].length-1;state.stepType='程序';state.panel='step';state.dirty=true;syncUrl();return render();}if(name==='remove-step'){if(state.list===list&&activeStep()&&!activeStep().locked){current()[list].splice(state.step,1);state.step=Math.max(0,state.step-1);state.dirty=true;}return render();}if(name==='up-step'||name==='down-step'){const steps=current()[list],offset=name==='up-step'?-1:1,next=state.step+offset;if(state.list===list&&steps[next]&&!steps[next].locked&&!activeStep()?.locked){[steps[state.step],steps[next]]=[steps[next],steps[state.step]];state.step=next;state.dirty=true;}return render();}if(name==='discover'||name==='new-provided'){state.panel='';syncUrl();return note('设计演示：已发现 editor-app 的 Debug / Release 两个目标。');}if(name==='new-program'||name==='new-script'){const script=name==='new-script';const config={id:'new-'+configs.length,name:script?'新 Shell 配置':'新程序配置',group:script?'Shell 脚本':'程序',shared:false,directory:'${workspace}',args:[],build:[],prelaunch:[],...(script?{interpreter:'powershell.exe',script:''}:{program:''})};configs.push(config);state.config=config.id;state.dirty=true;state.panel='';syncUrl();return render();}if(name==='copy-config'){const config=JSON.parse(JSON.stringify(current()));config.id='copy-'+configs.length;config.name+=' 副本';configs.push(config);state.config=config.id;state.dirty=true;return render();}if(name==='remove-config'){if(configs.length>1){configs.splice(configs.findIndex(config=>config.id===state.config),1);state.config=configs[0].id;state.step=0;}return render();}if(name==='args')return note('设计：参数以独立条目编辑，空格不会拆分参数。');if(name==='provider')return note('设计：列出已安装提供者，缺失能力时显示禁用原因。');if(name==='browse')return note('设计：调用本机文件 / 目录选择器。');if(name==='breakpoints')return note('设计：编辑配置所属的源文件与行号断点。');}
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.panel){state.panel='';syncUrl();render();return;}if(event.target.matches('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();changeVariant(event.key==='ArrowLeft'?-1:1);}});
render();
</script>
</body>
</html>
