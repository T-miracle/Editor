<!doctype html>
<!--
  Entry point for the site root.

  The documentation lives under a language prefix, so this file exists only to send
  a reader who lands on the project URL to the default language tree. Without it the
  root answers 404 even though every page is published.

  It is a static redirect rather than a generated page: the published tree stays one
  directory per language, which is what keeps the two trees exactly comparable.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Me Editor documentation</title>
    <meta name="description" content="Editor usage and the plugin capability contract for Me Editor." />
    <link rel="canonical" href="https://t-miracle.github.io/Editor/en/" />
    <meta http-equiv="refresh" content="0; url=/Editor/en/" />
  </head>
  <body>
    <p>
      Redirecting to the <a href="/Editor/en/">English documentation</a>. The
      <a href="/Editor/zh-cn/">Chinese documentation</a> is also available.
    </p>
    <script>
      // The meta refresh covers every client; this keeps the visible URL clean and
      // replaces the redirecting entry in history rather than adding to it.
      location.replace('/Editor/en/');
    </script>
  </body>
</html>
