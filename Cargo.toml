[workspace]
members = [
    "crates/editor-app",
    "crates/editor-core",
    "crates/platform-windows",
    "crates/plugin-schema",
    "crates/plugin-protocol",
    "crates/plugin-runtime",
]
# Guests build through the packaged host using its managed interface cache.
exclude = ["plugins/terminal", "plugins/example", "plugins/svg", "plugins/capability-example", "plugins/terminal/vendor/alacritty_terminal"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
dirs = "6.0"
# Keep the facade and directly used Base APIs on the same stable release.
gpui-kit = { version = "0.7.0", features = ["tree-sitter-languages"] }
ignore = "0.4"
# Native ReadDirectoryChangesW, FSEvents, and inotify backends watch the workspace.
notify = "8.2"
# Sorting the explorer by Chinese pronunciation needs a real reading, not a
# codepoint approximation. `plain` gives toneless ASCII syllables; the tone
# spellings would sort "chang" and "cháng" apart for no benefit.
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
rust-i18n = "4.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
toml = "0.9"
